<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fotos Polaroid - DilciaShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container flex-header">
      <a href="index.html" class="btn-outline">Voltar</a>
    </div>
  </header>

  <section class="produtos container">
    <h2 class="animate-fade">Polaroid</h2>
    <div class="grid">
      <div class="card animate-card">
        <img src="imgDilciaShop/fotos paloroid 3.jpg" alt="Combo 5 fotos 15.000kzs">
        <h3>Combo de 5 fotos Polaroid</h3>
        <p class="preco">15.000 Kz</p>
        <button onclick="comprarWhatsApp('Combo de 5 fotos Polaroid',15000)" class="btn-primary">Comprar</button>
      </div>
      <div class="card animate-card">
        <img src="imgDilciaShop/fotos paloroid 2.png" alt="Combo 10 fotos 30.000kzs">
        <h3>Combo de 10 fotos Polaroid</h3>
        <p class="preco">30.000 Kz</p>
        <button onclick="comprarWhatsApp('Combo de 10 fotos Polaroid',30000)" class="btn-primary">Comprar</button>
      </div>
      <div class="card animate-card">
        <img src="imgDilciaShop/fotos paloroid.jpg" alt="Combo 5 fotos 15.000kzs">
        <h3>Combo de 5 fotos Polaroid</h3>
        <p class="preco">15.000 Kz</p>
        <button onclick="comprarWhatsApp('Combo de 5 fotos Polaroid',15000)" class="btn-primary">Comprar</button>
      </div>
    </div>
  </section>

<script src="js/script.js"></script>
</body>
</html>

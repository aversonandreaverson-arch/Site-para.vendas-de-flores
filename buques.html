<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Buquês - DilciaShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container flex-header">
      <a href="index.html" class="btn-outline">Voltar</a>
    </div>
  </header>

  <section class="produtos container">
    <h2 class="animate-fade">Buquês</h2>
    <div class="grid">
      <div class="card animate-card">
        <img src="imgDilciaShop/Flores1.jpeg" alt="Buquê 15.000kzs">
        <h3>Buquê de Dinheiro</h3>
        <p class="preco">15.000 Kz</p>
        <button onclick="comprarWhatsApp('Buquê de Dinheiro',15000)" class="btn-primary">Comprar</button>
      </div>
      <div class="card animate-card">
        <img src="imgDilciaShop/Flores2.jpeg" alt="Buquê 20.000kzs">
        <h3>Buquê de Dinheiro</h3>
        <p class="preco">20.000 Kz</p>
        <button onclick="comprarWhatsApp('Buquê de Dinheiro',20000)" class="btn-primary">Comprar</button>
      </div>
      <div class="card animate-card">
        <img src="imgDilciaShop/Flores3.jpeg" alt="Buquê 25.000kzs">
        <h3>Buquê de Flores</h3>
        <p class="preco">25.000 Kz</p>
        <button onclick="comprarWhatsApp('Buquê de Flores',25000)" class="btn-primary">Comprar</button>
      </div>
    </div>
  </section>

<script src="js/script.js"></script>
</body>
</html>
